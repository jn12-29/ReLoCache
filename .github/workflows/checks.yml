name: Package and client checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Lint Python
        run: uvx ruff==0.16.7 check src tests examples
      - name: Build distributions
        run: uv build
      - name: Test installed Web Chat package without vLLM
        run: >-
          uv run --isolated --no-project
          --with 'dist/relocache-0.1.0-py3-none-any.whl[webchat]'
          --with pytest python -m pytest -q tests/test_webchat.py
      - name: Test browser conversation and streaming
        run: node --test tests/test_webchat_stream.mjs tests/test_webchat_conversation.mjs
